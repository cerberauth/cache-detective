name: Scans

on:
  push:
    branches:
      - main

env:
  GO_VERSION: "1.27"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build cache-detective
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build -o cache-detective .

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: cache-detective
          path: cache-detective
          retention-days: 1

  run-scan-fixtures:
    name: Scan fixtures - ${{ matrix.vulnerable && 'vulnerable' || 'not vulnerable' }}
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        vulnerable: [true, false]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cache-detective

      - name: Prepare binary
        run: chmod +x cache-detective

      - name: Run fixture server
        run: |
          go run ./testdata/fixtureserver -addr :8080 -vulnerable=${{ matrix.vulnerable }} &
          for i in $(seq 1 20); do curl -sf http://localhost:8080/cacheable > /dev/null && break; sleep 0.5; done

      - name: Scan (non-aggressive)
        run: |
          ./cache-detective scan --url http://localhost:8080/cacheable --requests 1 --sqa-opt-out \
            --output-format json --output cacheable-report.json --quiet

      - name: Check cacheable fixture is flagged cacheable
        run: |
          jq -e '[.findings[] | select(.title == "Cacheable response missing validators")] | length == 0' cacheable-report.json

      - name: Scan /account for cache deception (aggressive)
        run: |
          ./cache-detective scan --url http://localhost:8080/account --requests 1 --aggressive --sqa-opt-out \
            --output-format json --output account-report.json --quiet

      - name: Check cache-deception result matches expected vulnerability state
        run: |
          count=$(jq '[.findings[] | select(.title == "Cache deception via path confusion" or .title == "Authenticated response marked cacheable")] | length' account-report.json)
          if [ "${{ matrix.vulnerable }}" = "true" ]; then
            if [ "$count" -eq 0 ]; then
              echo "::error::No cache-deception/auth-cacheable finding for the vulnerable /account fixture"
              exit 1
            fi
            echo "Found $count finding(s) for the vulnerable /account fixture, as expected"
          else
            if [ "$count" -gt 0 ]; then
              echo "::error::Unexpected cache-deception/auth-cacheable finding for the fixed /account fixture"
              jq '.findings[] | .title' account-report.json
              exit 1
            fi
            echo "No finding for the fixed /account fixture, as expected"
          fi

      - name: Scan /poison for unkeyed header injection (aggressive)
        run: |
          ./cache-detective scan --url http://localhost:8080/poison --requests 1 --aggressive --sqa-opt-out \
            --output-format json --output poison-report.json --quiet

      - name: Check unkeyed-header-injection result matches expected vulnerability state
        run: |
          count=$(jq '[.findings[] | select(.title | startswith("Unkeyed header injection"))] | length' poison-report.json)
          if [ "${{ matrix.vulnerable }}" = "true" ]; then
            if [ "$count" -eq 0 ]; then
              echo "::error::No unkeyed-header-injection finding for the vulnerable /poison fixture"
              exit 1
            fi
            echo "Found $count finding(s) for the vulnerable /poison fixture, as expected"
          else
            if [ "$count" -gt 0 ]; then
              echo "::error::Unexpected unkeyed-header-injection finding for the fixed /poison fixture"
              exit 1
            fi
            echo "No finding for the fixed /poison fixture, as expected"
          fi

      - name: Scan /poison-cookie for unkeyed cookie injection (aggressive)
        # --max-aggressive-requests raised above its default (10): the
        # unkeyed-input miner mines headers before cookies, so a cookie-axis
        # finding needs enough budget to exhaust the (larger) header
        # wordlist first and still have budget left for the cookie axis.
        run: |
          ./cache-detective scan --url http://localhost:8080/poison-cookie --requests 1 --aggressive --max-aggressive-requests 20 --sqa-opt-out \
            --output-format json --output poison-cookie-report.json --quiet

      - name: Check unkeyed-cookie-injection result matches expected vulnerability state
        run: |
          count=$(jq '[.findings[] | select(.title | startswith("Unkeyed cookie injection"))] | length' poison-cookie-report.json)
          if [ "${{ matrix.vulnerable }}" = "true" ]; then
            if [ "$count" -eq 0 ]; then
              echo "::error::No unkeyed-cookie-injection finding for the vulnerable /poison-cookie fixture"
              exit 1
            fi
            echo "Found $count finding(s) for the vulnerable /poison-cookie fixture, as expected"
          else
            if [ "$count" -gt 0 ]; then
              echo "::error::Unexpected unkeyed-cookie-injection finding for the fixed /poison-cookie fixture"
              exit 1
            fi
            echo "No finding for the fixed /poison-cookie fixture, as expected"
          fi

      - name: Scan /poison-param for unkeyed query-parameter injection (aggressive)
        # --max-aggressive-requests raised further: the miner mines headers,
        # then cookies, then query parameters, so a query-parameter finding
        # needs enough budget to exhaust both preceding axes' wordlists
        # first.
        run: |
          ./cache-detective scan --url http://localhost:8080/poison-param --requests 1 --aggressive --max-aggressive-requests 50 --sqa-opt-out \
            --output-format json --output poison-param-report.json --quiet

      - name: Check unkeyed-query-parameter-injection result matches expected vulnerability state
        run: |
          count=$(jq '[.findings[] | select(.title | startswith("Unkeyed query parameter injection"))] | length' poison-param-report.json)
          if [ "${{ matrix.vulnerable }}" = "true" ]; then
            if [ "$count" -eq 0 ]; then
              echo "::error::No unkeyed-query-parameter-injection finding for the vulnerable /poison-param fixture"
              exit 1
            fi
            echo "Found $count finding(s) for the vulnerable /poison-param fixture, as expected"
          else
            if [ "$count" -gt 0 ]; then
              echo "::error::Unexpected unkeyed-query-parameter-injection finding for the fixed /poison-param fixture"
              exit 1
            fi
            echo "No finding for the fixed /poison-param fixture, as expected"
          fi

      - name: Scan /stale for stale-while-revalidate/stale-if-error behavior (aggressive)
        run: |
          ./cache-detective scan --url http://localhost:8080/stale --requests 1 --aggressive --stale-window-max-wait 10s --sqa-opt-out \
            --output-format json --output stale-report.json --quiet

      - name: Check stale-serving result matches expected vulnerability state
        run: |
          count=$(jq '[.findings[] | select(.title == "stale-while-revalidate not honored" or .title == "stale-if-error not honored")] | length' stale-report.json)
          if [ "${{ matrix.vulnerable }}" = "true" ]; then
            if [ "$count" -eq 0 ]; then
              echo "::error::No stale-serving finding for the vulnerable /stale fixture"
              exit 1
            fi
            echo "Found $count finding(s) for the vulnerable /stale fixture, as expected"
          else
            if [ "$count" -gt 0 ]; then
              echo "::error::Unexpected stale-serving finding for the fixed /stale fixture"
              jq '.findings[] | .title' stale-report.json
              exit 1
            fi
            echo "No finding for the fixed /stale fixture, as expected"
          fi

      - name: Scan cache-key, deception, and response fixtures (aggressive) and check each matches the expected vulnerability state
        # One scan per fixture, each judged by a finding title. Failures are
        # collected rather than aborting on the first, so a run reports every
        # fixture that regressed. See testdata/fixtureserver for what each
        # one simulates and which api-vulns-challenges challenge it mirrors.
        run: |
          failed=0
          check() {
            local path="$1" args="$2" title="$3" report
            report="fixture-$(echo "$path$title" | tr -c 'a-zA-Z0-9' '-').json"
            ./cache-detective scan --url "http://localhost:8080$path" $args --sqa-opt-out \
              --output-format json --output "$report" --quiet
            local count
            count=$(jq --arg t "$title" '[.findings[] | select(.title | startswith($t))] | length' "$report")
            if [ "${{ matrix.vulnerable }}" = "true" ]; then
              if [ "$count" -eq 0 ]; then
                echo "::error::No \"$title\" finding for the vulnerable $path fixture"; failed=1
              else
                echo "ok: $count \"$title\" finding(s) for the vulnerable $path fixture"
              fi
            else
              if [ "$count" -gt 0 ]; then
                echo "::error::Unexpected \"$title\" finding for the fixed $path fixture"; failed=1
              else
                echo "ok: no \"$title\" finding for the fixed $path fixture"
              fi
            fi
          }

          check "/fat-get?q=cats" "--requests 1 --aggressive" "Cache poisoning via fat GET request body"
          check "/cloak?id=1" "--requests 1 --aggressive" "Cache poisoning via parameter cloaking"
          check "/me" "--requests 1 --aggressive --bearer fixture-token" "Cache deception via static-directory path traversal"
          check "/me" "--requests 1 --aggressive --bearer fixture-token" "Cache deception via nested-encoded static-directory path traversal"
          check "/cacheable" "--requests 1 --aggressive" "Cache-key path collision via path traversal"
          # The delimiter & normalization mapper spends 10 requests on its
          # origin-side sweep, then up to 6 on the cache-side normalization
          # order and 2 per candidate on cache-only delimiters, so these need
          # a budget well above the default.
          check "/delim-origin" "--requests 1 --aggressive --max-aggressive-requests 30" "Origin-only path delimiter"
          check "/delim-cache" "--requests 1 --aggressive --max-aggressive-requests 30" "Cache-only path delimiter"
          check "/norm-order" "--requests 1 --aggressive --max-aggressive-requests 30" "Cache keys encoded"
          # The key-explosion check needs at least 21 requests (20 distinct
          # values plus a repeat) to tell "no cap" from "a cap above the sample".
          check "/explode?q=test" "--requests 1 --aggressive --max-aggressive-requests 30" "Unbounded cache-key cardinality"
          check "/vault" "--requests 1 --bearer fixture-token" "Authenticated response served to unauthenticated request"
          check "/session" "--requests 1" "Cacheable response sets a cookie"
          check "/validator" "--requests 1" "Unstable ETag validator"
          # Three samples, so the live-state check sees the MISS-then-HIT.
          check "/flaky" "--requests 3" "Response with a non-cacheable status is being served from cache"

          exit $failed

  run-scan-challenges:
    name: Scan challenge - ${{ matrix.challenge }} (${{ matrix.vulnerable && 'vulnerable' || 'not vulnerable' }})
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - challenge: "cache-conditional-validators"
            path: "/resource"
            vulnerable: true
            expect_title: "Conditional request not honored"
          - challenge: "cache-conditional-validators"
            path: "/resource"
            vulnerable: false
            expect_title: "Conditional request not honored"
          - challenge: "cache-control-directive-validation"
            path: "/report"
            vulnerable: true
            expect_title: "Conflicting Cache-Control directives"
          - challenge: "cache-control-directive-validation"
            path: "/report"
            vulnerable: false
            expect_title: "Conflicting Cache-Control directives"
          - challenge: "cache-deception-static-extension"
            path: "/profile"
            vulnerable: true
            scan_args: "--aggressive"
            expect_title: "Cache deception via path confusion"
          - challenge: "cache-deception-static-extension"
            path: "/profile"
            vulnerable: false
            scan_args: "--aggressive"
            expect_title: "Cache deception via path confusion"
          - challenge: "cache-deception-delimiter"
            path: "/account"
            vulnerable: true
            scan_args: "--aggressive"
            expect_title: "Cache deception via path confusion"
          - challenge: "cache-deception-delimiter"
            path: "/account"
            vulnerable: false
            scan_args: "--aggressive"
            expect_title: "Cache deception via path confusion"
          - challenge: "cache-cpdos-header-oversize"
            path: "/"
            vulnerable: true
            scan_args: "--aggressive"
            expect_title: "CPDoS via oversized headers (HHO)"
          - challenge: "cache-cpdos-header-oversize"
            path: "/"
            vulnerable: false
            scan_args: "--aggressive"
            expect_title: "CPDoS via oversized headers (HHO)"
          - challenge: "cache-cpdos-method-override"
            path: "/"
            vulnerable: true
            scan_args: "--aggressive"
            expect_title: "CPDoS via method override (HMO)"
          - challenge: "cache-cpdos-method-override"
            path: "/"
            vulnerable: false
            scan_args: "--aggressive"
            expect_title: "CPDoS via method override (HMO)"
          - challenge: "cache-cpdos-meta-character"
            path: "/?name=cache-detective"
            vulnerable: true
            scan_args: "--aggressive"
            expect_title: "CPDoS via HTTP meta-character (HMC)"
          - challenge: "cache-cpdos-meta-character"
            path: "/?name=cache-detective"
            vulnerable: false
            scan_args: "--aggressive"
            expect_title: "CPDoS via HTTP meta-character (HMC)"
          - challenge: "cache-poisoning-unkeyed-header"
            path: "/"
            vulnerable: true
            scan_args: "--aggressive"
            expect_title: "Unkeyed header injection"
          - challenge: "cache-poisoning-unkeyed-header"
            path: "/"
            vulnerable: false
            scan_args: "--aggressive"
            expect_title: "Unkeyed header injection"
          - challenge: "cache-poisoning-unkeyed-header"
            path: "/"
            vulnerable: true
            scan_args: "--aggressive --cache-buster-mode header"
            expect_title: "Unkeyed header injection"
          - challenge: "cache-poisoning-unkeyed-header"
            path: "/"
            vulnerable: false
            scan_args: "--aggressive --cache-buster-mode header"
            expect_title: "Unkeyed header injection"
          - challenge: "cache-sensitive-data-exposure"
            path: "/dashboard"
            vulnerable: true
            scan_args: "--aggressive --cookie session=cache-detective-scan"
            expect_title: "Authenticated response marked cacheable"
          - challenge: "cache-sensitive-data-exposure"
            path: "/dashboard"
            vulnerable: false
            scan_args: "--aggressive --cookie session=cache-detective-scan"
            expect_title: "Authenticated response marked cacheable"
          - challenge: "cache-sensitive-data-exposure"
            path: "/dashboard"
            vulnerable: true
            scan_args: "--aggressive --auth-profiles auth-profiles.json --max-retries 2 --retry-delay 200ms"
            expect_title: "Authenticated response marked cacheable"
          - challenge: "cache-sensitive-data-exposure"
            path: "/dashboard"
            vulnerable: false
            scan_args: "--aggressive --auth-profiles auth-profiles.json --max-retries 2 --retry-delay 200ms"
            expect_title: "Authenticated response marked cacheable"
          - challenge: "cache-conditional-validators"
            path: "/resource"
            vulnerable: true
            expect_title: "Unstable ETag validator"
          - challenge: "cache-conditional-validators"
            path: "/resource"
            vulnerable: false
            expect_title: "Unstable ETag validator"
          - challenge: "cache-poisoning-fat-get"
            path: "/search?q=cats"
            vulnerable: true
            scan_args: "--aggressive"
            expect_title: "Cache poisoning via fat GET request body"
          - challenge: "cache-poisoning-fat-get"
            path: "/search?q=cats"
            vulnerable: false
            scan_args: "--aggressive"
            expect_title: "Cache poisoning via fat GET request body"
          - challenge: "cache-poisoning-parameter-cloaking"
            path: "/greet?id=1"
            vulnerable: true
            scan_args: "--aggressive"
            expect_title: "Cache poisoning via parameter cloaking"
          - challenge: "cache-poisoning-parameter-cloaking"
            path: "/greet?id=1"
            vulnerable: false
            scan_args: "--aggressive"
            expect_title: "Cache poisoning via parameter cloaking"
          - challenge: "cache-deception-static-directory"
            path: "/account"
            vulnerable: true
            scan_args: "--aggressive --bearer victim-secret-token"
            expect_title: "Cache deception via static-directory path traversal"
          - challenge: "cache-deception-static-directory"
            path: "/account"
            vulnerable: false
            scan_args: "--aggressive --bearer victim-secret-token"
            expect_title: "Cache deception via static-directory path traversal"
          - challenge: "cache-deception-normalization"
            path: "/account"
            vulnerable: true
            scan_args: "--aggressive --bearer victim-secret-token"
            expect_title: "Cache deception via nested-encoded static-directory path traversal"
          - challenge: "cache-deception-normalization"
            path: "/account"
            vulnerable: false
            scan_args: "--aggressive --bearer victim-secret-token"
            expect_title: "Cache deception via nested-encoded static-directory path traversal"
          - challenge: "cache-poisoning-key-collision"
            path: "/account"
            vulnerable: true
            scan_args: "--aggressive"
            expect_title: "Cache-key path collision via path traversal"
          - challenge: "cache-poisoning-key-collision"
            path: "/account"
            vulnerable: false
            scan_args: "--aggressive"
            expect_title: "Cache-key path collision via path traversal"
          - challenge: "cache-key-explosion-dos"
            path: "/search?q=test"
            vulnerable: true
            scan_args: "--aggressive --max-aggressive-requests 30"
            expect_title: "Unbounded cache-key cardinality"
          - challenge: "cache-key-explosion-dos"
            path: "/search?q=test"
            vulnerable: false
            scan_args: "--aggressive --max-aggressive-requests 30"
            expect_title: "Unbounded cache-key cardinality"
          - challenge: "cache-sensitive-data-exposure"
            path: "/dashboard"
            vulnerable: true
            scan_args: "--aggressive"
            expect_title: "Cacheable response sets a cookie"
          - challenge: "cache-sensitive-data-exposure"
            path: "/dashboard"
            vulnerable: false
            scan_args: "--aggressive"
            expect_title: "Cacheable response sets a cookie"
          - challenge: "proxy-cache-deception"
            path: "/account"
            vulnerable: true
            scan_args: "--bearer victim-secret-token"
            expect_title: "Authenticated response served to unauthenticated request"
          - challenge: "proxy-cache-deception"
            path: "/account"
            vulnerable: false
            scan_args: "--bearer victim-secret-token"
            expect_title: "Authenticated response served to unauthenticated request"
          - challenge: "cache-vary-misconfiguration"
            path: "/home"
            vulnerable: true
            scan_args: "--cookie session=cache-detective-scan"
            expect_title: "Authenticated response served to unauthenticated request"
          - challenge: "cache-vary-misconfiguration"
            path: "/home"
            vulnerable: false
            scan_args: "--cookie session=cache-detective-scan"
            expect_title: "Authenticated response served to unauthenticated request"

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write per-target auth profile
        # Exercises --auth-profiles: same credential the sibling --cookie
        # matrix rows pass directly, but resolved per-origin instead.
        run: |
          cat > auth-profiles.json <<'EOF'
          { "http://localhost:8080": { "cookies": { "session": "cache-detective-scan" } } }
          EOF

      - name: Run challenge server
        run: docker run -d -p 8080:8080 ghcr.io/cerberauth/api-vulns-challenges/${{ matrix.challenge }}:latest serve --vulnerable=${{ matrix.vulnerable }}

      - name: Wait for challenge server
        # A plain TCP check, not an HTTP GET against matrix.path: some of
        # these challenges simulate a permanent, single-slot cache with no
        # TTL — the very first request ever made to the resource freezes
        # its cached response for the container's lifetime. An HTTP
        # readiness probe against the tested path would itself become that
        # first request and silently pre-poison the fixture before the
        # scan below gets a chance to.
        run: |
          for i in $(seq 1 40); do (exec 3<>/dev/tcp/localhost/8080) 2>/dev/null && exec 3<&- 3>&- && break; sleep 0.25; done

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cache-detective

      - name: Prepare binary
        run: chmod +x cache-detective

      - name: Scan
        run: |
          ./cache-detective scan --url "http://localhost:8080${{ matrix.path }}" --requests 1 ${{ matrix.scan_args }} --sqa-opt-out \
            --output-format json --output challenge-report.json --quiet

      - name: Check result matches expected vulnerability state
        run: |
          count=$(jq --arg t "${{ matrix.expect_title }}" '[.findings[] | select(.title == $t or (.title | startswith($t)))] | length' challenge-report.json)
          if [ "${{ matrix.vulnerable }}" = "true" ]; then
            if [ "$count" -eq 0 ]; then
              echo "::error::No \"${{ matrix.expect_title }}\" finding for the vulnerable ${{ matrix.challenge }} challenge"
              exit 1
            fi
            echo "Found $count finding(s) for the vulnerable ${{ matrix.challenge }} challenge, as expected"
          else
            if [ "$count" -gt 0 ]; then
              echo "::error::Unexpected \"${{ matrix.expect_title }}\" finding for the fixed ${{ matrix.challenge }} challenge"
              jq '.findings[] | .title' challenge-report.json
              exit 1
            fi
            echo "No \"${{ matrix.expect_title }}\" finding for the fixed ${{ matrix.challenge }} challenge, as expected"
          fi

      - name: Check authenticated-cacheable severity escalates on sensitive content
        if: ${{ matrix.challenge == 'cache-sensitive-data-exposure' && matrix.vulnerable && matrix.expect_title == 'Authenticated response marked cacheable' }}
        run: |
          jq -e '[.findings[] | select(.title == "Authenticated response marked cacheable") | select(.extra.severity == "critical")] | length > 0' challenge-report.json

      - name: Check cacheable-Set-Cookie severity escalates on a token in the body
        if: ${{ matrix.challenge == 'cache-sensitive-data-exposure' && matrix.vulnerable && matrix.expect_title == 'Cacheable response sets a cookie' }}
        run: |
          jq -e '[.findings[] | select(.title == "Cacheable response sets a cookie") | select(.extra.severity == "critical")] | length > 0' challenge-report.json

      - name: Stop challenge server
        if: ${{ always() }}
        run: docker stop $(docker ps -q --filter ancestor=ghcr.io/cerberauth/api-vulns-challenges/${{ matrix.challenge }}:latest)
